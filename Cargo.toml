[workspace]
resolver = "2"
members = [
    "crates/flow-types",
    "crates/flow-operator",
    "crates/flow-cli"
]

[workspace.dependencies]
k8s-openapi = { version = "0.21.0" } 
kube = { version = "0.88.0", features = ["runtime", "derive", "client"] }
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "0.8"
anyhow = "1.0"
tracing = "0.1"
serde_yaml = "0.9"
