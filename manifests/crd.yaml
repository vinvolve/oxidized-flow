apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: pipelines.rustflow.org
spec:
  group: rustflow.org
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                steps:
                  type: array
                  items:
                    type: object
                    properties:
                      name: { type: string }
                      image: { type: string }
            status:
              type: object
              properties:
                state: { type: string }
                current_step: { type: string }
  scope: Namespaced
  names:
    plural: pipelines
    singular: pipeline
    kind: Pipeline
